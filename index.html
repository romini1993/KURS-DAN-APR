<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CalcPro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454269.png">
    <meta name="theme-color" content="#0f172a">
    <title>CalcKurs Pro Fix</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --up: #4ade80; 
            --down: #f87171;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 400px; padding: env(safe-area-inset-top) 20px 100px 20px; }

        .tab-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 400px; background: var(--card);
            display: flex; justify-content: space-around; padding: 12px;
            border-top: 1px solid #334155; z-index: 100;
        }
        .tab-btn {
            background: transparent; border: none; color: var(--subtext);
            font-weight: bold; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn.active { color: var(--accent); }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        h2 { margin: 0; font-size: 22px; color: var(--accent); }
        .refresh-btn { background: var(--card); border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        /* Container untuk Card + Tombol Delete diluar */
        .card-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; width: 100%; }

        .coin-card { 
            background: var(--card); border-radius: 16px; padding: 14px 18px; 
            display: flex; align-items: center; gap: 12px; border: 1px solid #334155; position: relative; flex: 1;
        }
        .coin-info { flex: 1; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .coin-info label { font-size: 11px; color: var(--subtext); font-weight: bold; }
        
        .price-change { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
        .price-change.plus { color: var(--up); background: rgba(74, 222, 128, 0.1); }
        .price-change.minus { color: var(--down); background: rgba(248, 113, 113, 0.1); }

        .logo-wrapper { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #475569; flex-shrink: 0; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .input-wrapper { display: flex; align-items: center; gap: 8px; }
        input { width: 100%; background: transparent; border: none; color: white; font-size: 20px; font-weight: bold; outline: none; padding: 0; }
        
        .copy-btn-kurs { color: var(--subtext); font-size: 16px; cursor: pointer; opacity: 0.5; }
        .copy-btn-kurs:active { transform: scale(0.8); }

        .search-section { margin-top: 30px; border-top: 1px dashed #334155; padding-top: 20px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; font-size: 14px; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 10px; padding: 0 15px; font-weight: bold; cursor: pointer; }
        
        /* TOMBOL HAPUS DI LUAR */
        .delete-btn-outer { 
            color: #ef4444; font-size: 28px; cursor: pointer; 
            padding: 5px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; opacity: 0.8;
        }
        .delete-btn-outer:active { transform: scale(1.2); opacity: 1; }

        .status-info { font-size: 11px; color: var(--subtext); text-align: center; margin-top: 10px; }

        /* APR STYLES */
        .currency-switch { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; padding: 5px; border-radius: 12px; }
        .currency-switch button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: transparent; color: var(--subtext); }
        .currency-switch button.active { background: var(--accent); color: #0f172a; }
        .apr-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--subtext); }
        .apr-input-box { width: 100%; padding: 14px; margin-bottom: 5px; border: 2px solid #334155; border-radius: 12px; background: #0f172a; }
        .terbilang { font-size: 13px; color: var(--accent); margin-bottom: 20px; font-weight: 500; min-height: 15px; }
        .apr-card { padding: 18px; border-radius: 16px; margin-bottom: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .val { font-size: 24px; font-weight: 800; display: block; margin-top: 4px; }
        .title { font-size: 11px; text-transform: uppercase; font-weight: bold; opacity: 0.8; }
        
        #toast {
            visibility: hidden; min-width: 150px; background-color: var(--accent); color: #0f172a;
            text-align: center; border-radius: 10px; padding: 10px; position: fixed;
            z-index: 200; left: 50%; bottom: 85px; transform: translateX(-50%);
            font-weight: bold; font-size: 12px;
        }
        #toast.show { visibility: visible; animation: fadeinout 2s; }
        @keyframes fadeinout { from {opacity: 0;} 20% {opacity: 1;} 80% {opacity: 1;} to {opacity: 0;} }
    </style>
</head>
<body>

<div id="toast">Copied!</div>

<div class="container">
    <div id="page-kurs" class="page active">
        <div class="header">
            <h2>💱 Calc Kurs Pro</h2>
            <button class="refresh-btn" onclick="fetchAllPrices()">🔄 Update</button>
        </div>

        <div id="fixed-list">
            <div class="card-wrapper">
                <div class="coin-card" style="border-left: 5px solid #ef4444;">
                    <div class="logo-wrapper"><img src="https://api.iconify.design/emojione:flag-for-indonesia.svg"></div>
                    <div class="coin-info">
                        <label>IDR (Rupiah)</label>
                        <div class="input-wrapper">
                            <input type="text" id="idr" inputmode="decimal" placeholder="0" oninput="calculateKurs('idr')">
                            <span class="copy-btn-kurs" onclick="copyValKurs('idr')">📋</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="coin-card" style="border-left: 5px solid #3b82f6;">
                    <div class="logo-wrapper"><img src="https://api.iconify.design/emojione:flag-for-united-states.svg"></div>
                    <div class="coin-info">
                        <label>USD (Dollar)</label>
                        <div class="input-wrapper">
                            <input type="text" id="usd" inputmode="decimal" placeholder="0" oninput="calculateKurs('usd')">
                            <span class="copy-btn-kurs" onclick="copyValKurs('usd')">📋</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="coin-card" style="border-left: 5px solid #f7931a;">
                    <div class="logo-wrapper"><img src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png"></div>
                    <div class="coin-info">
                        <div class="label-row">
                            <label>BTC (Bitcoin)</label>
                            <span id="change-btc" class="price-change">--</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="btc" inputmode="decimal" placeholder="0" oninput="calculateKurs('btc')">
                            <span class="copy-btn-kurs" onclick="copyValKurs('btc')">📋</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="coin-card" style="border-left: 5px solid #627eea;">
                    <div class="logo-wrapper"><img src="https://assets.coingecko.com/coins/images/279/large/ethereum.png"></div>
                    <div class="coin-info">
                        <div class="label-row">
                            <label>ETH (Ethereum)</label>
                            <span id="change-eth" class="price-change">--</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="eth" inputmode="decimal" placeholder="0" oninput="calculateKurs('eth')">
                            <span class="copy-btn-kurs" onclick="copyValKurs('eth')">📋</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="watchlist"></div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tambah: sui, deep, sol...">
                <button class="add-btn" onclick="addCoin()">Tambah</button>
            </div>
            <div id="status" class="status-info">Ready, Bro!</div>
        </div>
    </div>

    <div id="page-apr" class="page">
        <div class="header"><h2>💰 Calc APR</h2></div>
        <label class="apr-label">MATA UANG</label>
        <div class="currency-switch">
            <button id="btn-idr-apr" class="active" onclick="setCurrencyAPR('IDR')">IDR (Rp)</button>
            <button id="btn-usd-apr" onclick="setCurrencyAPR('USD')">USD ($)</button>
        </div>
        <label id="label-saldo-apr" class="apr-label">JUMLAH SALDO (Rp)</label>
        <div class="apr-input-box"><input type="text" id="saldo-apr" inputmode="decimal" placeholder="0" oninput="hitungAPR()"></div>
        <div id="cek-saldo-apr" class="terbilang"></div>
        <label class="apr-label">BUNGA PER TAHUN (%)</label>
        <div class="apr-input-box"><input type="text" id="bunga-apr" inputmode="decimal" placeholder="0" oninput="hitungAPR()"></div>
        
        <div style="margin-top: 25px;">
            <div class="apr-card" style="background:rgba(56,189,248,0.1); color:#38bdf8;"><span class="title">Harian</span><span id="harian-apr" class="val">0</span><span id="harian-idr" style="font-size:12px; color:#94a3b8;"></span></div>
            <div class="apr-card" style="background:rgba(167,139,250,0.1); color:#a78bfa;"><span class="title">Mingguan</span><span id="mingguan-apr" class="val">0</span><span id="mingguan-idr" style="font-size:12px; color:#94a3b8;"></span></div>
            <div class="apr-card" style="background:rgba(74,222,128,0.1); color:#4ade80;"><span class="title">Bulanan</span><span id="bulanan-apr" class="val">0</span><span id="bulanan-idr" style="font-size:12px; color:#94a3b8;"></span></div>
            <div class="apr-card" style="background:rgba(251,191,36,0.1); color:#fbbf24;"><span class="title">Tahunan</span><span id="tahunan-apr" class="val">0</span><span id="tahunan-idr" style="font-size:12px; color:#94a3b8;"></span></div>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('kurs', this)"><span>💱</span><span>Kurs</span></button>
    <button class="tab-btn" onclick="switchTab('apr', this)"><span>💰</span><span>APR</span></button>
</div>

<script>
    let usdToIdr = 16250; 
    let prices = { btc: 0, eth: 0 };
    let changes = { btc: 0, eth: 0 };
    let watchlist = JSON.parse(localStorage.getItem('kurs_v4_list')) || [];

    function switchTab(target, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + target).classList.add('active');
        btn.classList.add('active');
    }

    function formatOutput(num, dec) {
        if (!num || num === 0) return "";
        return new Intl.NumberFormat('en-US', { maximumFractionDigits: dec }).format(num);
    }

    function copyValKurs(id) {
        let val = document.getElementById(id).value.replace(/,/g, '');
        if (!val || val == "0") return;
        navigator.clipboard.writeText(val).then(() => {
            let t = document.getElementById("toast");
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 2000);
        });
    }

    function calculateKurs(source) {
        let el = document.getElementById(source);
        let raw = el.value.replace(/,/g, '');
        if (raw === "" || raw === ".") {
            const inputs = document.querySelectorAll('#page-kurs input[inputmode="decimal"]');
            inputs.forEach(i => { if(i.id !== source) i.value = ""; });
            return;
        }
        let val = parseFloat(raw) || 0;
        let baseUsd = (source === 'idr') ? val / usdToIdr : (source === 'usd' ? val : val * (prices[source] || 0));

        if (source !== 'idr') document.getElementById('idr').value = formatOutput(baseUsd * usdToIdr, 0);
        if (source !== 'usd') document.getElementById('usd').value = formatOutput(baseUsd, 4);
        if (source !== 'btc') document.getElementById('btc').value = formatOutput(baseUsd / (prices.btc || 1), 8);
        if (source !== 'eth') document.getElementById('eth').value = formatOutput(baseUsd / (prices.eth || 1), 8);
        
        watchlist.forEach(s => {
            if (s !== source) {
                let target = document.getElementById(s);
                if (target) target.value = formatOutput(baseUsd / (prices[s] || 1), 6);
            }
        });
    }

    async function fetchData(s) {
        try {
            const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${s.toUpperCase()}USDT`);
            const d = await r.json();
            if (d.result && d.result.list && d.result.list.length > 0) {
                const t = d.result.list[0];
                const last = parseFloat(t.lastPrice);
                const prev = parseFloat(t.prevPrice24h);
                const chg = ((last - prev) / prev) * 100;
                return { price: last, change: chg };
            }
        } catch (e) { console.error(e); }
        return { price: 0, change: 0 };
    }

    function updateChangeUI(id, val) {
        const el = document.getElementById(`change-${id}`);
        if (!el) return;
        const sign = val >= 0 ? "+" : "";
        el.innerText = `${sign}${val.toFixed(2)}%`;
        el.className = `price-change ${val >= 0 ? 'plus' : 'minus'}`;
    }

    function renderWatchlist() {
        let container = document.getElementById('watchlist');
        container.innerHTML = "";
        watchlist.forEach(s => {
            const chg = changes[s] || 0;
            const sign = chg >= 0 ? "+" : "";
            container.innerHTML += `
                <div class="card-wrapper">
                    <div class="coin-card">
                        <div class="logo-wrapper">
                            <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${s.toLowerCase()}.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041888.png'">
                        </div>
                        <div class="coin-info">
                            <div class="label-row">
                                <label>${s}</label>
                                <span class="price-change ${chg >= 0 ? 'plus' : 'minus'}">${sign}${chg.toFixed(2)}%</span>
                            </div>
                            <div class="input-wrapper">
                                <input type="text" id="${s}" inputmode="decimal" placeholder="0" oninput="calculateKurs('${s}')">
                                <span class="copy-btn-kurs" onclick="copyValKurs('${s}')">📋</span>
                            </div>
                        </div>
                    </div>
                    <div class="delete-btn-outer" onclick="removeCoin('${s}')">×</div>
                </div>`;
        });
    }

    async function fetchAllPrices() {
        document.getElementById('status').innerText = "Updating...";
        const b = await fetchData('BTC'); prices.btc = b.price; changes.btc = b.change; updateChangeUI('btc', b.change);
        const e = await fetchData('ETH'); prices.eth = e.price; changes.eth = e.change; updateChangeUI('eth', e.change);
        for (let s of watchlist) {
            const d = await fetchData(s);
            if (d.price > 0) { prices[s] = d.price; changes[s] = d.change; }
        }
        renderWatchlist();
        document.getElementById('status').innerText = "Update: " + new Date().toLocaleTimeString();
    }

    async function addCoin() {
        let s = document.getElementById('search-input').value.toUpperCase().trim();
        if (!s || watchlist.includes(s)) return;
        let d = await fetchData(s);
        if (d.price > 0) {
            watchlist.push(s); prices[s] = d.price; changes[s] = d.change;
            localStorage.setItem('kurs_v4_list', JSON.stringify(watchlist));
            renderWatchlist();
            document.getElementById('search-input').value = "";
        }
    }

    function removeCoin(s) {
        watchlist = watchlist.filter(i => i !== s);
        localStorage.setItem('kurs_v4_list', JSON.stringify(watchlist));
        renderWatchlist();
    }

    let currAPR = 'IDR';
    function setCurrencyAPR(t) {
        currAPR = t;
        document.getElementById('btn-idr-apr').classList.toggle('active', t === 'IDR');
        document.getElementById('btn-usd-apr').classList.toggle('active', t === 'USD');
        document.getElementById('label-saldo-apr').innerText = `JUMLAH SALDO (${t === 'IDR' ? 'Rp' : '$'})`;
        hitungAPR();
    }

    function hitungAPR() {
        let s = parseFloat(document.getElementById('saldo-apr').value.replace(/,/g, '')) || 0;
        let b = parseFloat(document.getElementById('bunga-apr').value.replace(/,/g, '')) || 0;
        const thn = s * (b / 100);
        const p = {'tahunan': thn, 'bulanan': thn/12, 'mingguan': thn/52, 'harian': thn/365};
        document.getElementById('cek-saldo-apr').innerText = (currAPR === 'USD') ? "Rp " + formatOutput(s * usdToIdr, 0) : "Rp " + formatOutput(s, 0);
        for (let k in p) {
            let v = p[k];
            document.getElementById(`${k}-apr`).innerText = (currAPR === 'IDR') ? "Rp " + formatOutput(v, 0) : "$ " + v.toFixed(2);
            document.getElementById(`${k}-idr`).innerText = (currAPR === 'USD' && v > 0) ? "≈ Rp " + formatOutput(v * usdToIdr, 0) : "";
        }
    }

    window.onload = fetchAllPrices;
</script>
</body>
</html>
