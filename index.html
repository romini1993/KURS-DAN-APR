<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CalcPro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454269.png">
    <meta name="theme-color" content="#0f172a">
    <title>CalcKurs Pro Bybit Edition</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --up: #4ade80; 
            --down: #f87171;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 400px; padding: env(safe-area-inset-top) 20px 100px 20px; }

        /* TAB NAVIGATION */
        .tab-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 400px; background: var(--card);
            display: flex; justify-content: space-around; padding: 12px;
            border-top: 1px solid #334155; z-index: 100;
        }
        .tab-btn {
            background: transparent; border: none; color: var(--subtext);
            font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn.active { color: var(--accent); }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* KURS STYLES */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        h2 { margin: 0; font-size: 22px; color: var(--accent); }
        .refresh-btn { background: var(--card); border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .coin-card { 
            background: var(--card); border-radius: 16px; padding: 14px 18px; margin-bottom: 12px; 
            display: flex; align-items: center; gap: 12px; border: 1px solid #334155; 
            position: relative;
        }
        .coin-info { flex: 1; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .coin-info label { font-size: 11px; color: var(--subtext); font-weight: bold; }
        
        .price-change { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; }
        .price-change.plus { color: var(--up); background: rgba(74, 222, 128, 0.1); }
        .price-change.minus { color: var(--down); background: rgba(248, 113, 113, 0.1); }

        .logo-wrapper { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #475569; flex-shrink: 0; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .input-wrapper { display: flex; align-items: center; gap: 8px; }
        input { width: 100%; background: transparent; border: none; color: white; font-size: 20px; font-weight: bold; outline: none; padding: 0; }
        
        .copy-btn-kurs { color: var(--subtext); font-size: 16px; cursor: pointer; padding: 5px; opacity: 0.5; }
        .copy-btn-kurs:active { transform: scale(0.8); opacity: 1; color: var(--accent); }

        .search-section { margin-top: 30px; border-top: 1px dashed #334155; padding-top: 20px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; font-size: 14px; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 10px; padding: 0 15px; font-weight: bold; cursor: pointer; }
        .delete-btn { color: #ef4444; font-size: 24px; cursor: pointer; padding-left: 5px; }
        .status-info { font-size: 11px; color: var(--subtext); text-align: center; margin-top: 10px; }

        /* APR STYLES */
        .currency-switch { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; padding: 5px; border-radius: 12px; }
        .currency-switch button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: transparent; color: var(--subtext); transition: 0.3s; }
        .currency-switch button.active { background: var(--accent); color: #0f172a; }
        .apr-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--subtext); }
        .apr-input-box { width: 100%; padding: 14px; margin-bottom: 5px; border: 2px solid #334155; border-radius: 12px; background: #0f172a; }
        .terbilang { font-size: 13px; color: var(--accent); margin-bottom: 20px; font-weight: 500; min-height: 15px; }
        .sub-val { font-size: 12px; color: #94a3b8; display: block; margin-top: 2px; font-weight: 500; }
        .apr-card { padding: 18px; border-radius: 16px; margin-bottom: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .hari { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .minggu { background: rgba(167, 139, 250, 0.1); color: #a78bfa; }
        .bulan { background: rgba(74, 222, 128, 0.1); color: #4ade80; }
        .tahun { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
        .val { font-size: 24px; font-weight: 800; display: block; margin-top: 4px; }
        .title { font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; opacity: 0.8; }

            visibility: hidden; min-width: 150px; background-color: var(--accent); color: #0f172a;
