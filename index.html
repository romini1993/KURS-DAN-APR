<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>CalcPro v8</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px 20px 100px 20px; }
        
        .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 400px; background: var(--card); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #334155; z-index: 100; }
        .tab-btn { background: transparent; border: none; color: var(--subtext); font-weight: bold; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .tab-btn.active { color: var(--accent); }
        
        .page { display: none; }
        .page.active { display: block; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .refresh-btn { background: var(--card); border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; }
        
        .coin-card { background: var(--card); border-radius: 16px; padding: 12px 15px; display: flex; align-items: center; gap: 12px; border: 1px solid #334155; margin-bottom: 10px; }
        .coin-info { flex: 1; }
        label { display: block; font-size: 11px; color: var(--subtext); margin-bottom: 4px; text-transform: uppercase; }
        input { width: 100%; background: transparent; border: none; color: white; font-size: 18px; font-weight: bold; outline: none; }

        .kurs-badge { font-size: 12px; color: var(--accent); background: rgba(56,189,248,0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--accent); }
        .currency-switch { display: flex; gap: 8px; margin-bottom: 15px; background: var(--card); padding: 4px; border-radius: 12px; }
        .currency-switch button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: var(--subtext); font-weight: bold; }
        .currency-switch button.active { background: var(--accent); color: #0f172a; }

        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .apr-card { padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .apr-card span { display: block; }
        .apr-card .title { font-size: 10px; font-weight: bold; opacity: 0.7; }
        .apr-card .val { font-size: 16px; font-weight: 800; margin: 5px 0; }
        .apr-card .sub { font-size: 10px; opacity: 0.6; }

        .harian { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .mingguan { background: rgba(167, 139, 250, 0.1); color: #a78bfa; }
        .bulanan { background: rgba(74, 222, 128, 0.1); color: #4ade80; }
        .tahunan { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }

        .status { font-size: 10px; color: var(--subtext); text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="page-kurs" class="page active">
        <div class="header">
            <h2 style="color:var(--accent)">💱 Kurs</h2>
            <button class="refresh-btn" onclick="fetchAll()">🔄 Update</button>
        </div>
        <div class="coin-card"><div class="coin-info"><label>IDR</label><input type="text" id="idr" inputmode="decimal" oninput="kalkulasi('idr')"></div></div>
        <div class="coin-card"><div class="coin-info"><label>USD</label><input type="text" id="usd" inputmode="decimal" oninput="kalkulasi('usd')"></div></div>
        <div class="coin-card"><div class="coin-info"><label>BTC</label><input type="text" id="btc" inputmode="decimal" oninput="kalkulasi('btc')"></div></div>
        <div class="coin-card"><div class="coin-info"><label>ETH</label><input type="text" id="eth" inputmode="decimal" oninput="kalkulasi('eth')"></div></div>
        <div id="watchlist-area"></div>
    </div>

    <div id="page-apr" class="page">
        <div class="header">
            <h2 style="color:var(--accent)">💰 APR</h2>
            <div id="rate-display" class="kurs-badge">Rate: Rp ...</div>
        </div>
        <div class="currency-switch">
            <button id="btn-idr" onclick="setMode('IDR')">IDR</button>
            <button id="btn-usd" onclick="setMode('USD')">USD</button>
        </div>
        <label>Saldo</label>
        <div class="coin-card"><input type="text" id="apr-saldo" inputmode="decimal" oninput="hitung()"></div>
        <label>Bunga (%)</label>
        <div class="coin-card"><input type="text" id="apr-bunga" inputmode="decimal" oninput="hitung()"></div>
        
        <div class="result-grid">
            <div class="apr-card harian"><span class="title">HARIAN</span><span id="res-h-val" class="val">0</span><span id="res-h-sub" class="sub"></span></div>
            <div class="apr-card mingguan"><span class="title">MINGGUAN</span><span id="res-m-val" class="val">0</span><span id="res-m-sub" class="sub"></span></div>
            <div class="apr-card bulanan"><span class="title">BULANAN</span><span id="res-b-val" class="val">0</span><span id="res-b-sub" class="sub"></span></div>
            <div class="apr-card tahunan"><span class="title">TAHUNAN</span><span id="res-t-val" class="val">0</span><span id="res-t-sub" class="sub"></span></div>
        </div>
    </div>

    <div id="msg" class="status">Ready...</div>
</div>

<div class="tab-bar">
    <button id="t-kurs" class="tab-btn active" onclick="tab('kurs')"><span>💱</span><span>Kurs</span></button>
    <button id="t-apr" class="tab-btn" onclick="tab('apr')"><span>💰</span><span>APR</span></button>
</div>

<script>
    // DATA STATE
    let rateUSD = parseFloat(localStorage.getItem('saved_rate')) || 16350;
    let btcPrice = 0, ethPrice = 0;
    let modeAPR = localStorage.getItem('mode_apr') || 'IDR';

    // TAB SYSTEM
    function tab(name) {
        localStorage.setItem('last_tab', name);
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + name).classList.add('active');
        document.getElementById('t-' + name).classList.add('active');
    }

    // FORMATTER
    function fmt(n, d=0) {
        if(!n || n==0) return "";
        return new Intl.NumberFormat('en-US', {maximumFractionDigits: d}).format(n);
    }

    // FETCH DATA
    async function fetchAll() {
        document.getElementById('msg').innerText = "Updating data...";
        try {
            // Get USD/IDR from a stable source
            const r1 = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTIDRT');
            const d1 = await r1.json();
            if(d1.price) rateUSD = parseFloat(d1.price);

            const r2 = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
            const d2 = await r2.json();
            if(d2.price) btcPrice = parseFloat(d2.price);

            const r3 = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT');
            const d3 = await r3.json();
            if(d3.price) ethPrice = parseFloat(d3.price);

            localStorage.setItem('saved_rate', rateUSD);
            document.getElementById('rate-display').innerText = "Rate: Rp " + Math.round(rateUSD).toLocaleString('id-ID');
            document.getElementById('msg').innerText = "Update: " + new Date().toLocaleTimeString();
            hitung();
        } catch (e) {
            document.getElementById('msg').innerText = "Offline / Error API";
        }
    }

    // KURS LOGIC
    function kalkulasi(src) {
        let input = document.getElementById(src);
        let val = parseFloat(input.value.replace(/,/g, '')) || 0;
        let usdBase = 0;

        if(src === 'idr') usdBase = val / rateUSD;
        else if(src === 'usd') usdBase = val;
        else if(src === 'btc') usdBase = val * btcPrice;
        else if(src === 'eth') usdBase = val * ethPrice;

        if(src !== 'idr') document.getElementById('idr').value = fmt(usdBase * rateUSD, 0);
        if(src !== 'usd') document.getElementById('usd').value = fmt(usdBase, 2);
        if(src !== 'btc') document.getElementById('btc').value = fmt(usdBase / btcPrice, 6);
        if(src !== 'eth') document.getElementById('eth').value = fmt(usdBase / ethPrice, 6);
    }

    // APR LOGIC
    function setMode(m) {
        modeAPR = m;
        localStorage.setItem('mode_apr', m);
        document.getElementById('btn-idr').className = m === 'IDR' ? 'active' : '';
        document.getElementById('btn-usd').className = m === 'USD' ? 'active' : '';
        hitung();
    }

    function hitung() {
        let sStr = document.getElementById('apr-saldo').value;
        let bStr = document.getElementById('apr-bunga').value;
        
        localStorage.setItem('last_saldo', sStr);
        localStorage.setItem('last_bunga', bStr);

        let s = parseFloat(sStr.replace(/,/g, '')) || 0;
        let b = parseFloat(bStr.replace(/,/g, '')) || 0;

        let tahunan = s * (b/100);
        let data = {
            t: tahunan,
            b: tahunan / 12,
            m: tahunan / 52,
            h: tahunan / 365
        };

        for(let k in data) {
            let v = data[k];
            let elVal = document.getElementById(`res-${k}-val`);
            let elSub = document.getElementById(`res-${k}-sub`);

            if(modeAPR === 'IDR') {
                elVal.innerText = "Rp " + Math.floor(v).toLocaleString('id-ID');
                elSub.innerText = "";
            } else {
                elVal.innerText = "$ " + v.toLocaleString('en-US', {maximumFractionDigits:2});
                elSub.innerText = "≈ Rp " + Math.floor(v * rateUSD).toLocaleString('id-ID');
            }
        }
    }

    // STARTUP
    window.onload = () => {
        // Restore values
        document.getElementById('apr-saldo').value = localStorage.getItem('last_saldo') || "";
        document.getElementById('apr-bunga').value = localStorage.getItem('last_bunga') || "";
        
        const last = localStorage.getItem('last_tab') || 'kurs';
        tab(last);
        setMode(modeAPR);
        fetchAll();
    };
</script>
</body>
</html>
