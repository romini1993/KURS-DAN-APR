<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>CalcKurs Bybit Fix</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --up: #4ade80; 
            --down: #f87171;
        }
        * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 400px; padding: 20px 20px 100px 20px; }

        /* TAB BAR */
        .tab-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 400px; background: var(--card);
            display: flex; justify-content: space-around; padding: 12px;
            border-top: 1px solid #334155; z-index: 1000;
        }
        .tab-btn { background: transparent; border: none; color: var(--subtext); font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .tab-btn.active { color: var(--accent); }

        .page { display: none; }
        .page.active { display: block; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .refresh-btn { background: var(--card); border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* CARD RE-DESIGN */
        .coin-card { 
            background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; 
            border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px;
        }
        
        .row-top { display: flex; justify-content: space-between; align-items: center; }
        .row-main { display: flex; align-items: center; gap: 10px; }

        .coin-label { font-size: 11px; font-weight: bold; color: var(--subtext); text-transform: uppercase; }
        .price-change { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .plus { color: var(--up); background: rgba(74, 222, 128, 0.1); }
        .minus { color: var(--down); background: rgba(248, 113, 113, 0.1); }

        .logo-wrapper { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: #0f172a; flex-shrink: 0; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .input-box { flex: 1; display: flex; align-items: center; gap: 5px; }
        input { width: 100%; background: transparent; border: none; color: white; font-size: 18px; font-weight: bold; outline: none; }
        
        .copy-btn { font-size: 18px; cursor: pointer; opacity: 0.6; padding: 4px; }
        .del-btn { color: var(--down); font-size: 22px; font-weight: bold; cursor: pointer; margin-right: 5px; }

        /* SEARCH */
        .search-box { display: flex; gap: 8px; margin-top: 20px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 14px; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 8px; padding: 0 15px; font-weight: bold; }

        /* APR */
        .apr-input-box { width: 100%; padding: 12px; background: var(--card); border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; margin-bottom: 10px; }
        .apr-card { padding: 15px; border-radius: 12px; margin-bottom: 8px; text-align: center; }
        
        #toast {
            visibility: hidden; background: var(--accent); color: #0f172a; padding: 10px;
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); border-radius: 8px; z-index: 2000;
        }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

<div id="toast">Berhasil Copy!</div>

<div class="container">
    <div id="page-kurs" class="page active">
        <div class="header">
            <h2 style="color:var(--accent)">💱 Calc Kurs</h2>
            <button class="refresh-btn" onclick="fetchAllPrices()">🔄 Update</button>
        </div>

        <div id="fixed-list">
            <div class="coin-card" style="border-left: 4px solid var(--down)">
                <div class="row-top"><span class="coin-label">Indonesian Rupiah</span></div>
                <div class="row-main">
                    <div class="logo-wrapper"><img src="https://flagcdn.com/w80/id.png"></div>
                    <div class="input-box">
                        <input type="text" id="idr" inputmode="decimal" placeholder="0" oninput="calculateKurs('idr')">
                        <span class="copy-btn" onclick="copyVal('idr')">📋</span>
                    </div>
                </div>
            </div>
            <div class="coin-card" style="border-left: 4px solid #3b82f6">
                <div class="row-top"><span class="coin-label">US Dollar</span></div>
                <div class="row-main">
                    <div class="logo-wrapper"><img src="https://flagcdn.com/w80/us.png"></div>
                    <div class="input-box">
                        <input type="text" id="usd" inputmode="decimal" placeholder="0" oninput="calculateKurs('usd')">
                        <span class="copy-btn" onclick="copyVal('usd')">📋</span>
                    </div>
                </div>
            </div>
            <div class="coin-card" style="border-left: 4px solid #f7931a">
                <div class="row-top"><span class="coin-label">Bitcoin</span><span id="change-btc" class="price-change">--</span></div>
                <div class="row-main">
                    <div class="logo-wrapper"><img src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png"></div>
                    <div class="input-box">
                        <input type="text" id="btc" inputmode="decimal" placeholder="0" oninput="calculateKurs('btc')">
                        <span class="copy-btn" onclick="copyVal('btc')">📋</span>
                    </div>
                </div>
            </div>
            <div class="coin-card" style="border-left: 4px solid #627eea">
                <div class="row-top"><span class="coin-label">Ethereum</span><span id="change-eth" class="price-change">--</span></div>
                <div class="row-main">
                    <div class="logo-wrapper"><img src="https://assets.coingecko.com/coins/images/279/large/ethereum.png"></div>
                    <div class="input-box">
                        <input type="text" id="eth" inputmode="decimal" placeholder="0" oninput="calculateKurs('eth')">
                        <span class="copy-btn" onclick="copyVal('eth')">📋</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="watchlist"></div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tambah: sui, sol, bnb...">
            <button class="add-btn" onclick="addCoin()">Tambah</button>
        </div>
        <p id="status" style="font-size:10px; text-align:center; color:var(--subtext); margin-top:10px;">Ready, Bro!</p>
    </div>

    <div id="page-apr" class="page">
        <h2 style="color:var(--accent)">💰 Calc APR</h2>
        <label style="font-size:12px; color:var(--subtext)">JUMLAH SALDO (IDR)</label>
        <input type="text" id="saldo-apr" class="apr-input-box" inputmode="decimal" placeholder="0" oninput="hitungAPR()">
        <label style="font-size:12px; color:var(--subtext)">BUNGA PER TAHUN (%)</label>
        <input type="text" id="bunga-apr" class="apr-input-box" inputmode="decimal" placeholder="0" oninput="hitungAPR()">
        
        <div style="margin-top:20px">
            <div class="apr-card" style="background:rgba(56,189,248,0.1); color:var(--accent)"><span>Harian</span><br><b id="h-apr" style="font-size:20px">0</b></div>
            <div class="apr-card" style="background:rgba(74,222,128,0.1); color:var(--up)"><span>Bulanan</span><br><b id="b-apr" style="font-size:20px">0</b></div>
            <div class="apr-card" style="background:rgba(251,191,36,0.1); color:#fbbf24)"><span>Tahunan</span><br><b id="t-apr" style="font-size:20px">0</b></div>
        </div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab-btn active" onclick="switchTab('kurs', this)"><span>💱</span><span>Kurs</span></div>
    <div class="tab-btn" onclick="switchTab('apr', this)"><span>💰</span><span>APR</span></div>
</div>

<script>
    let usdToIdr = 16300;
    let prices = { btc: 0, eth: 0 };
    let changes = { btc: 0, eth: 0 };
    let watchlist = JSON.parse(localStorage.getItem('koin_list_v7')) || [];

    function switchTab(t, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + t).classList.add('active');
        btn.classList.add('active');
    }

    function formatNum(n, d) {
        if (!n || n == 0) return "";
        return new Intl.NumberFormat('en-US', { maximumFractionDigits: d }).format(n);
    }

    function copyVal(id) {
        let v = document.getElementById(id).value.replace(/,/g, '');
        if (!v) return;
        navigator.clipboard.writeText(v);
        let t = document.getElementById('toast');
        t.className = "show";
        setTimeout(() => t.className = "", 2000);
    }

    async function fetchBybit(s) {
        try {
            const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${s.toUpperCase()}USDT`);
            const d = await r.json();
            if (d.result && d.result.list.length > 0) {
                const t = d.result.list[0];
                const last = parseFloat(t.lastPrice);
                const prev = parseFloat(t.prevPrice24h);
                return { price: last, change: ((last - prev) / prev) * 100 };
            }
        } catch (e) { console.error(e); }
        return { price: 0, change: 0 };
    }

    function calculateKurs(source) {
        let val = parseFloat(document.getElementById(source).value.replace(/,/g, '')) || 0;
        let baseUsd = (source === 'idr') ? val / usdToIdr : (source === 'usd' ? val : val * (prices[source] || 0));

        if (source !== 'idr') document.getElementById('idr').value = formatNum(baseUsd * usdToIdr, 0);
        if (source !== 'usd') document.getElementById('usd').value = formatNum(baseUsd, 4);
        if (source !== 'btc') document.getElementById('btc').value = formatNum(baseUsd / (prices.btc || 1), 8);
        if (source !== 'eth') document.getElementById('eth').value = formatNum(baseUsd / (prices.eth || 1), 8);
        
        watchlist.forEach(s => {
            if (s !== source) document.getElementById(s).value = formatNum(baseUsd / (prices[s] || 1), 6);
        });
    }

    function renderWatchlist() {
        let div = document.getElementById('watchlist');
        div.innerHTML = "";
        watchlist.forEach(s => {
            const chg = changes[s] || 0;
            div.innerHTML += `
                <div class="coin-card">
                    <div class="row-top">
                        <span class="coin-label">${s}</span>
                        <span class="price-change ${chg >= 0 ? 'plus' : 'minus'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>
                    </div>
                    <div class="row-main">
                        <div class="del-btn" onclick="removeCoin('${s}')">×</div>
                        <div class="logo-wrapper"><img src="https://www.lbank.com/logo/${s.toUpperCase()}.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041888.png'"></div>
                        <div class="input-box">
                            <input type="text" id="${s}" inputmode="decimal" placeholder="0" oninput="calculateKurs('${s}')">
                            <span class="copy-btn" onclick="copyVal('${s}')">📋</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    async function fetchAllPrices() {
        document.getElementById('status').innerText = "Loading...";
        const b = await fetchBybit('BTC'); prices.btc = b.price; changes.btc = b.change;
        const e = await fetchBybit('ETH'); prices.eth = e.price; changes.eth = e.change;
        
        document.getElementById('change-btc').innerText = (b.change >= 0 ? '+' : '') + b.change.toFixed(2) + '%';
        document.getElementById('change-btc').className = 'price-change ' + (b.change >= 0 ? 'plus' : 'minus');
        document.getElementById('change-eth').innerText = (e.change >= 0 ? '+' : '') + e.change.toFixed(2) + '%';
        document.getElementById('change-eth').className = 'price-change ' + (e.change >= 0 ? 'plus' : 'minus');

        for (let s of watchlist) {
            const d = await fetchBybit(s);
            if (d.price > 0) { prices[s] = d.price; changes[s] = d.change; }
        }
        renderWatchlist();
        document.getElementById('status').innerText = "Update: " + new Date().toLocaleTimeString();
    }

    async function addCoin() {
        let s = document.getElementById('search-input').value.toUpperCase().trim();
        if (!s || watchlist.includes(s)) return;
        let d = await fetchBybit(s);
        if (d.price > 0)
