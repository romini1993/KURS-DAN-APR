<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CalcPro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454269.png">
    <meta name="theme-color" content="#0f172a">
    <title>CalcKurs Pro All-in-One</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 400px; padding: env(safe-area-inset-top) 20px 100px 20px; }

        /* TAB NAVIGATION */
        .tab-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 400px; background: var(--card);
            display: flex; justify-content: space-around; padding: 12px;
            border-top: 1px solid #334155; z-index: 100;
        }
        .tab-btn {
            background: transparent; border: none; color: var(--subtext);
            font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn.active { color: var(--accent); }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* KURS STYLES */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        h2 { margin: 0; font-size: 22px; color: var(--accent); }
        .refresh-btn { background: var(--card); border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .coin-card { 
            background: var(--card); border-radius: 16px; padding: 14px 18px; margin-bottom: 12px; 
            display: flex; align-items: center; gap: 15px; border: 1px solid #334155; 
        }
        .coin-info { flex: 1; }
        .coin-info label { display: block; font-size: 11px; color: var(--subtext); font-weight: bold; margin-bottom: 2px; }
        .logo-wrapper { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a; border: 1px solid #475569; flex-shrink: 0; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        input { width: 100%; background: transparent; border: none; color: white; font-size: 20px; font-weight: bold; outline: none; padding: 0; }
        
        .search-section { margin-top: 30px; border-top: 1px dashed #334155; padding-top: 20px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; font-size: 14px; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 10px; padding: 0 15px; font-weight: bold; cursor: pointer; }
        .delete-btn { color: #ef4444; font-size: 24px; cursor: pointer; padding-left: 10px; }
        .status-info { font-size: 11px; color: var(--subtext); text-align: center; margin-top: 10px; }

        /* APR STYLES */
        .currency-switch { display: flex; gap: 10px; margin-bottom: 20px; background: #0f172a; padding: 5px; border-radius: 12px; }
        .currency-switch button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: transparent; color: var(--subtext); transition: 0.3s; }
        .currency-switch button.active { background: var(--accent); color: #0f172a; }
        .apr-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--subtext); }
        .apr-input-box { width: 100%; padding: 14px; margin-bottom: 5px; border: 2px solid #334155; border-radius: 12px; background: #0f172a; }
        .terbilang { font-size: 13px; color: var(--accent); margin-bottom: 20px; font-weight: 500; min-height: 15px; }
        .sub-val { font-size: 12px; color: #94a3b8; display: block; margin-top: 2px; font-weight: 500; }
        .apr-card { padding: 18px; border-radius: 16px; margin-bottom: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .hari { background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .minggu { background: rgba(167, 139, 250, 0.1); color: #a78bfa; }
        .bulan { background: rgba(74, 222, 128, 0.1); color: #4ade80; }
        .tahun { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
        .val { font-size: 24px; font-weight: 800; display: block; margin-top: 4px; }
        .title { font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div id="page-kurs" class="page active">
        <div class="header">
            <h2>💱 Calc Kurs Fast</h2>
            <button class="refresh-btn" onclick="fetchAllPrices()">🔄 Update</button>
        </div>

        <div id="fixed-list">
            <div class="coin-card" style="border-left: 5px solid #ef4444;">
                <div class="logo-wrapper"><img src="https://api.iconify.design/emojione:flag-for-indonesia.svg"></div>
                <div class="coin-info">
                    <label>IDR (Rupiah)</label>
                    <input type="text" id="idr" inputmode="decimal" placeholder="0" oninput="calculateKurs('idr')">
                </div>
            </div>
            <div class="coin-card" style="border-left: 5px solid #3b82f6;">
                <div class="logo-wrapper"><img src="https://api.iconify.design/emojione:flag-for-united-states.svg"></div>
                <div class="coin-info">
                    <label>USD (Dollar)</label>
                    <input type="text" id="usd" inputmode="decimal" placeholder="0" oninput="calculateKurs('usd')">
                </div>
            </div>
            <div class="coin-card" style="border-left: 5px solid #f7931a;">
                <div class="logo-wrapper"><img src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png"></div>
                <div class="coin-info">
                    <label>BTC (Bitcoin)</label>
                    <input type="text" id="btc" inputmode="decimal" placeholder="0" oninput="calculateKurs('btc')">
                </div>
            </div>
            <div class="coin-card" style="border-left: 5px solid #627eea;">
                <div class="logo-wrapper"><img src="https://assets.coingecko.com/coins/images/279/large/ethereum.png"></div>
                <div class="coin-info">
                    <label>ETH (Ethereum)</label>
                    <input type="text" id="eth" inputmode="decimal" placeholder="0" oninput="calculateKurs('eth')">
                </div>
            </div>
        </div>
        <div id="watchlist"></div>
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tambah: sui, deep, sol...">
                <button class="add-btn" onclick="addCoin()">Tambah</button>
            </div>
            <div id="status" class="status-info">Ready, Bro!</div>
        </div>
    </div>

    <div id="page-apr" class="page">
        <div class="header">
            <h2>💰 Calc APR</h2>
        </div>
        
        <label class="apr-label">MATA UANG</label>
        <div class="currency-switch">
            <button id="btn-idr-apr" class="active" onclick="setCurrencyAPR('IDR')">IDR (Rp)</button>
            <button id="btn-usd-apr" onclick="setCurrencyAPR('USD')">USD ($)</button>
        </div>
        
        <label id="label-saldo-apr" class="apr-label">JUMLAH SALDO (Rp)</label>
        <div class="apr-input-box">
            <input type="text" id="saldo-apr" inputmode="decimal" placeholder="0" oninput="hitungAPR()">
        </div>
        <div id="cek-saldo-apr" class="terbilang"></div>
        
        <label class="apr-label">BUNGA PER TAHUN (%)</label>
        <div class="apr-input-box">
            <input type="text" id="bunga-apr" inputmode="decimal" placeholder="0" oninput="hitungAPR()">
        </div>

        <div style="margin-top: 25px;">
            <div class="apr-card hari">
                <span class="title">Estimasi Harian</span>
                <span id="harian-apr" class="val">0</span>
                <span id="harian-idr" class="sub-val"></span>
            </div>
            <div class="apr-card minggu">
                <span class="title">Estimasi Mingguan</span>
                <span id="mingguan-apr" class="val">0</span>
                <span id="mingguan-idr" class="sub-val"></span>
            </div>
            <div class="apr-card bulan">
                <span class="title">Estimasi Bulanan</span>
                <span id="bulanan-apr" class="val">0</span>
                <span id="bulanan-idr" class="sub-val"></span>
            </div>
            <div class="apr-card tahun">
                <span class="title">Estimasi Tahunan</span>
                <span id="tahunan-apr" class="val">0</span>
                <span id="tahunan-idr" class="sub-val"></span>
            </div>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('kurs', this)"><span>💱</span><span>Kurs</span></button>
    <button class="tab-btn" onclick="switchTab('apr', this)"><span>💰</span><span>APR</span></button>
</div>

<script>
    function switchTab(target, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + target).classList.add('active');
        btn.classList.add('active');
    }

    let usdToIdr = 16250; 
    let prices = { btc: 0, eth: 0 };
    let watchlist = JSON.parse(localStorage.getItem('kurs_fast_v3')) || [];

    // Fungsi format angka dengan koma (untuk output)
    function formatOutput(num, dec) {
        if (num === 0) return "";
        return new Intl.NumberFormat('en-US', { maximumFractionDigits: dec, minimumIntegerDigits: 1 }).format(num);
    }

    // Fungsi format mata uang khusus APR (IDR pake titik, USD pake koma)
    function formatCurrencyAPR(angka, type) {
        if (type === 'IDR') {
            return "Rp " + new Intl.NumberFormat('id-ID').format(Math.floor(angka));
        } else {
            return "$ " + new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(angka);
        }
    }

    // --- LOGIKA KURS ---
    function calculateKurs(source) {
        let el = document.getElementById(source);
        let rawValue = el.value.replace(/,/g, '');
        if (rawValue === "" || rawValue === "." || rawValue === "0" || rawValue === "0.") {
            const allInputs = document.querySelectorAll('#page-kurs input[inputmode="decimal"]');
            allInputs.forEach(input => { if(input.id !== source) input.value = ""; });
            return;
        }
        let val = parseFloat(rawValue) || 0;
        let baseUsd = (source === 'idr') ? val / usdToIdr : (source === 'usd' ? val : val * (prices[source] || 0));

        if (source !== 'idr') document.getElementById('idr').value = formatOutput(baseUsd * usdToIdr, 0);
        if (source !== 'usd') document.getElementById('usd').value = formatOutput(baseUsd, 4);
        if (source !== 'btc') document.getElementById('btc').value = formatOutput(baseUsd / (prices.btc || 1), 8);
        if (source !== 'eth') document.getElementById('eth').value = formatOutput(baseUsd / (prices.eth || 1), 8);
        watchlist.forEach(s => {
            if (s !== source) {
                let target = document.getElementById(s);
                if (target) target.value = formatOutput(baseUsd / (prices[s] || 1), 6);
            }
        });
        if (!el.value.includes('.')) {
            let d = (source === 'idr') ? 0 : (source === 'usd' ? 4 : 8);
            el.value = formatOutput(val, d);
        }
    }

    // --- LOGIKA APR (DENGAN KURS RUPIAH OTOMATIS) ---
    let currentCurrencyAPR = 'IDR';
    function setCurrencyAPR(type) {
        currentCurrencyAPR = type;
        document.getElementById('btn-idr-apr').classList.toggle('active', type === 'IDR');
        document.getElementById('btn-usd-apr').classList.toggle('active', type === 'USD');
        document.getElementById('label-saldo-apr').innerText = `JUMLAH SALDO (${type === 'IDR' ? 'Rp' : '$'})`;
        hitungAPR();
    }

    function hitungAPR() {
        let elSaldo = document.getElementById('saldo-apr');
        let elBunga = document.getElementById('bunga-apr');
        
        let rawSaldo = elSaldo.value.replace(/,/g, '');
        let rawBunga = elBunga.value.replace(/,/g, '');
        
        let saldo = parseFloat(rawSaldo) || 0;
        let bunga = parseFloat(rawBunga) || 0;

        // Auto-format input dengan koma
        if (!elSaldo.value.includes('.')) elSaldo.value = formatOutput(saldo, 4);
        if (!elBunga.value.includes('.')) elBunga.value = formatOutput(bunga, 2);

        // Tampilan kurs IDR di bawah input saldo (kalo lagi mode USD)
        if (currentCurrencyAPR === 'USD') {
            document.getElementById('cek-saldo-apr').innerText = formatCurrencyAPR(saldo * usdToIdr, 'IDR');
        } else {
            document.getElementById('cek-saldo-apr').innerText = formatCurrencyAPR(saldo, 'IDR');
        }

        const hasilTahun = saldo * (bunga / 100);
        const periods = {
            'tahunan': hasilTahun,
            'bulanan': hasilTahun / 12,
            'mingguan': hasilTahun / 52,
            'harian': hasilTahun / 365
        };

        for (let key in periods) {
            let val = periods[key];
            document.getElementById(`${key}-apr`).innerText = formatCurrencyAPR(val, currentCurrencyAPR);
            
            // Tambahin kurs rupiah di bawah hasil kalau lagi mode USD
            let subEl = document.getElementById(`${key}-idr`);
            if (currentCurrencyAPR === 'USD' && val > 0) {
                subEl.innerText = "≈ " + formatCurrencyAPR(val * usdToIdr, 'IDR');
            } else {
                subEl.innerText = "";
            }
        }
    }

    // --- FETCH DATA ---
    async function fetchPrice(s) {
        try {
            const r = await fetch(`https://cryptoprices.cc/${s.toUpperCase()}`);
            const t = await r.text();
            return parseFloat(t.trim()) || 0;
        } catch { return 0; }
    }

    async function fetchAllPrices() {
        document.getElementById('status').innerText = "Updating...";
        // Ambil Kurs USD ke IDR terbaru (Opsional, gua patok 16250 dulu)
        prices.btc = await fetchPrice('BTC');
        prices.eth = await fetchPrice('ETH');
        for (let s of watchlist) prices[s] = await fetchPrice(s);
        renderWatchlist();
        document.getElementById('status').innerText = "Update: " + new Date().toLocaleTimeString();
    }

    function getLogo(sym) {
        const s = sym.toLowerCase();
        const map = {
            'sui': 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/sui/info/logo.png',
            'deep': 'https://assets.coingecko.com/coins/images/40049/large/deep.png',
            'sol': 'https://assets.coingecko.com/coins/images/4128/large/solana.png'
        };
        return map[s] || `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${s}.png`;
    }

    async function addCoin() {
        let s = document.getElementById('search-input').value.toUpperCase().trim();
        if (!s || watchlist.includes(s)) return;
        let p = await fetchPrice(s);
        if (p > 0) {
            watchlist.push(s); prices[s] = p;
            localStorage.setItem('kurs_fast_v3', JSON.stringify(watchlist));
            renderWatchlist();
            document.getElementById('search-input').value = "";
        }
    }

    function removeCoin(s) {
        watchlist = watchlist.filter(i => i !== s);
        localStorage.setItem('kurs_fast_v3', JSON.stringify(watchlist));
        renderWatchlist();
    }

    function renderWatchlist() {
        let container = document.getElementById('watchlist');
        container.innerHTML = "";
        watchlist.forEach(s => {
            container.innerHTML += `<div class="coin-card"><div class="logo-wrapper"><img src="${getLogo(s)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041888.png'"></div><div class="coin-info"><label>${s}</label><input type="text" id="${s}" inputmode="decimal" placeholder="0" oninput="calculateKurs('${s}')"></div><div class="delete-btn" onclick="removeCoin('${s}')">×</div></div>`;
        });
    }

    window.onload = fetchAllPrices;
</script>
</body>
</html>
